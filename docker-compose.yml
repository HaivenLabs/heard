services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heard
      POSTGRES_USER: heard
      POSTGRES_PASSWORD: heard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heard -d heard"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${HEARD_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - heard-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      target: api
    environment:
      APP_ENV: docker
      HEARD_BIND_ADDRESS: "${HEARD_BIND_ADDRESS:-127.0.0.1}"
      APP_PORT: "8080"
      DATABASE_URL: postgres://heard:heard@db:5432/heard?sslmode=disable
      PUBLIC_APP_URL: http://localhost:3010
      WEB_BASE_URL: http://localhost:3010
      ALLOWED_ORIGIN: http://localhost:3010
      HEARD_SEED_DEMO: "${HEARD_SEED_DEMO:-true}"
      QURL_BASE_URL: ""
      PUBLIC_WRITE_RATE_LIMIT: "30"
      PUBLIC_WRITE_RATE_WINDOW_SECONDS: "60"
      TRUSTED_PROXY_CIDRS: ""
      PASSAGE_MODE: ${PASSAGE_MODE:-local}
      LOCAL_PASSAGE_SECRET: heard-docker-local-only-secret
      PASSAGE_BASE_URL: ${PASSAGE_BASE_URL:-http://host.docker.internal:8081}
      PASSAGE_PUBLIC_URL: ${PASSAGE_PUBLIC_URL:-http://localhost:3020}
      PASSAGE_ISSUER: ${PASSAGE_ISSUER:-http://localhost:8081}
      PASSAGE_AUDIENCE: ${PASSAGE_AUDIENCE:-heard}
      PASSAGE_CLIENT_ID: ${PASSAGE_CLIENT_ID:-heard}
      PASSAGE_CALLBACK_URL: ${PASSAGE_CALLBACK_URL:-http://localhost:3010/api/v1/auth/callback}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HEARD_BIND_ADDRESS:-127.0.0.1}:${HEARD_API_PORT:-8082}:8080"

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      APP_ENV: docker
      HEARD_BIND_ADDRESS: "${HEARD_BIND_ADDRESS:-127.0.0.1}"
      DATABASE_URL: postgres://heard:heard@db:5432/heard?sslmode=disable
      PUBLIC_APP_URL: http://localhost:3010
      WEB_BASE_URL: http://localhost:3010
      HEARD_SEED_DEMO: "${HEARD_SEED_DEMO:-true}"
      WORKER_POLL_INTERVAL_MS: "1200"
      WORKER_BATCH_SIZE: "50"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_APP_ENV: docker
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
      NEXT_PUBLIC_APP_ENV: docker
      NEXT_PUBLIC_DEMO_TENANT_ID: 11111111-1111-1111-1111-111111111111
    depends_on:
      - api
    ports:
      - "${HEARD_BIND_ADDRESS:-127.0.0.1}:3010:3010"

volumes:
  heard-postgres:
