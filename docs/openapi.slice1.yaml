openapi: 3.1.0
info:
  title: Heard API
  version: 0.5.0
  description: >
    Heard's tenant-scoped campaign, guest feedback, and recovery APIs. Manager
    routes require a Passage-issued Bearer product token and matching tenant membership.
    Production validation requires EdDSA with Passage JWKS, the configured issuer,
    audience `heard`, token expiry, UUID subject and organization claims, a known
    organization role, and a `heard` product-access grant. Client role or tenant
    headers never create identity authority.
servers:
  - url: http://localhost:3010
    description: Same-origin web gateway for local development
security:
  - bearerAuth: []
paths:
  /api/v1/healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
  /api/v1/marketing-leads:
    post:
      summary: Request a heard product conversation
      description: Stores a restaurant prospect's explicit request to be contacted by heard.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketingLeadRequest"
      responses:
        "201":
          description: Contact request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingLead"
        "400":
          description: Contact request is incomplete or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/local/session:
    post:
      summary: Issue a local Passage-compatible development session
      description: Available only when the non-production local Passage adapter is enabled.
      security: []
      x-local-development-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalSessionRequest"
      responses:
        "201":
          description: Local development session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/local/registration:
    post:
      summary: Register through the local Passage-compatible development adapter
      description: >
        Creates a predictable non-production Passage account context for the
        self-service onboarding workflow. This endpoint is unavailable in
        production and is not the production Passage registration contract.
      security: []
      x-local-development-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalSessionRequest"
      responses:
        "201":
          description: Local development registration resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/session:
    get:
      summary: Resolve the current Passage identity
      responses:
        "200":
          description: Authenticated identity and claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding:
    get:
      summary: Resolve the current operator's Heard onboarding state
      responses:
        "200":
          description: Current durable onboarding state and next incomplete step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding/activations:
    post:
      summary: Create or resume the first restaurant workspace and location
      description: >
        Derives actor and account context from the verified Passage identity.
        Retries and concurrent requests for the same actor return the same
        activation, tenant, and location.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingActivationRequest"
      responses:
        "200":
          description: Workspace activation created or safely resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          description: Activation data or account context is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Verified identity may not activate a Heard workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/tenants:
    post:
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /api/v1/tenants/{id}:
    get:
      summary: Get tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /api/v1/locations:
    get:
      summary: List locations for the active tenant
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Location collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Location"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Create location
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /api/v1/survey-campaigns:
    get:
      summary: List survey campaigns for the active tenant
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Survey campaign collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SurveyCampaign"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Create a survey campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurveyCampaignRequest"
      responses:
        "201":
          description: Survey campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyCampaign"
  /api/v1/survey-campaigns/{id}:
    get:
      summary: Get a survey campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Survey campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyCampaign"
  /api/v1/public/surveys/{token}:
    get:
      summary: Resolve a public survey campaign by opaque token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public survey and feedback link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSurvey"
  /api/v1/locations/{id}:
    get:
      summary: Get location
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /api/v1/feedback-links:
    post:
      summary: Create feedback link
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackLinkRequest"
      responses:
        "201":
          description: Feedback link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-links/{id}/qr:
    post:
      summary: Regenerate QR for feedback link
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/FeedbackLinkId"
      responses:
        "200":
          description: Feedback link with QR payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-links/resolve/{token}:
    get:
      summary: Resolve feedback link token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved feedback link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-sessions:
    post:
      summary: Create feedback session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackSessionRequest"
      responses:
        "201":
          description: Feedback session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSession"
  /api/v1/feedback-responses:
    get:
      summary: List feedback responses
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Feedback response collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedbackResponse"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Submit feedback response
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackRequest"
      responses:
        "201":
          description: Feedback response created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
  /api/v1/feedback-responses/{id}:
    get:
      summary: Get feedback response
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feedback response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
  /api/v1/recovery-cases:
    get:
      summary: List recovery cases
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recovery case collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecoveryCase"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
  /api/v1/recovery-cases/{id}:
    get:
      summary: Get recovery case
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recovery case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCase"
    patch:
      summary: Update recovery case status
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecoveryCaseRequest"
      responses:
        "200":
          description: Recovery case updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCase"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Passage access token
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource or development-only endpoint is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    TenantHeader:
      name: X-Heard-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedbackLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status]
          properties:
            message: { type: string }
            status: { type: integer }
    Identity:
      type: object
      required: [user_id, email, display_name, role, tenant_ids, permissions, provider]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string }
        tenant_ids:
          type: array
          items: { type: string, format: uuid }
        permissions:
          type: array
          items: { type: string }
        provider: { type: string }
    Session:
      type: object
      required: [access_token, expires_at, identity, tenant_id]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        identity: { $ref: "#/components/schemas/Identity" }
        tenant_id: { type: string, format: uuid }
    CreateLocalSessionRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    CreateOnboardingActivationRequest:
      type: object
      required: [restaurant_name, location_name, source]
      additionalProperties: false
      properties:
        restaurant_name: { type: string, minLength: 2, maxLength: 160 }
        location_name: { type: string, minLength: 2, maxLength: 160 }
        timezone: { type: string, default: America/Los_Angeles }
        source: { type: string, enum: [homepage, guest_demo, direct] }
    OnboardingState:
      type: object
      required: [status, next_step]
      properties:
        activation_id: { type: string, format: uuid }
        status: { type: string, enum: [not_started, in_progress, complete] }
        next_step: { type: string, enum: [workspace, campaign, feedback_link, complete] }
        source: { type: string, enum: [homepage, guest_demo, direct] }
        tenant: { $ref: "#/components/schemas/Tenant" }
        location: { $ref: "#/components/schemas/Location" }
        campaign: { $ref: "#/components/schemas/SurveyCampaign" }
        feedback_link: { $ref: "#/components/schemas/FeedbackLink" }
    MarketingLead:
      type: object
      required: [id, name, work_email, phone, restaurant_name, location_count, challenge, source, contact_consent, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        work_email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32, pattern: "^[+()0-9 .-]*$" }
        restaurant_name: { type: string, minLength: 2, maxLength: 160 }
        location_count: { type: string, enum: ["1", "2-4", "5-19", "20-49", "50+"] }
        challenge: { type: string, maxLength: 1000 }
        source: { type: string, enum: [marketing_site, guest_demo] }
        contact_consent: { type: boolean, const: true }
        status: { type: string, enum: [new] }
        created_at: { type: string, format: date-time }
    CreateMarketingLeadRequest:
      type: object
      required: [name, work_email, restaurant_name, location_count, contact_consent]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        work_email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32, pattern: "^[+()0-9 .-]*$" }
        restaurant_name: { type: string, minLength: 2, maxLength: 160 }
        location_count: { type: string, enum: ["1", "2-4", "5-19", "20-49", "50+"] }
        challenge: { type: string, maxLength: 1000 }
        source: { type: string, enum: [marketing_site, guest_demo], default: marketing_site }
        contact_consent: { type: boolean, const: true }
    Tenant:
      type: object
      required: [id, name, slug, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    Location:
      type: object
      required: [id, tenant_id, name, slug, timezone, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
    SurveyCampaign:
      type: object
      required: [id, tenant_id, location_id, name, restaurant_name, headline, prompt, incentive_text, sms_keyword, sms_phone, google_review_url, yelp_review_url, status, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        restaurant_name: { type: string }
        headline: { type: string }
        prompt: { type: string }
        incentive_text: { type: string }
        sms_keyword: { type: string }
        sms_phone: { type: string }
        google_review_url: { type: string, format: uri }
        yelp_review_url: { type: string, format: uri }
        status: { type: string }
        created_at: { type: string, format: date-time }
    PublicSurvey:
      type: object
      required: [link, campaign]
      properties:
        link: { $ref: "#/components/schemas/FeedbackLink" }
        campaign: { $ref: "#/components/schemas/SurveyCampaign" }
    FeedbackLink:
      type: object
      required: [id, tenant_id, location_id, name, token, status, channel, qr_asset_url, destination_url, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        token: { type: string }
        status: { type: string }
        channel: { type: string }
        qr_asset_url: { type: string }
        qr_svg: { type: string }
        destination_url: { type: string }
        created_at: { type: string, format: date-time }
    FeedbackSession:
      type: object
      required: [id, tenant_id, location_id, status, source, channel, wants_follow_up, contact_consent, marketing_consent, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        feedback_link_id: { type: string, format: uuid }
        status: { type: string }
        source: { type: string }
        channel: { type: string }
        guest_name: { type: string }
        guest_phone: { type: string, maxLength: 32, pattern: "^[+()0-9 .-]*$" }
        guest_email: { type: string, format: email, maxLength: 254 }
        wants_follow_up: { type: boolean }
        contact_consent: { type: boolean }
        marketing_consent: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    FeedbackResponse:
      type: object
      required: [id, tenant_id, location_id, feedback_session_id, rating, sentiment, comment, categories, wants_follow_up, contact_consent, marketing_consent, metadata, submitted_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        feedback_session_id: { type: string, format: uuid }
        feedback_link_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        sentiment: { type: string, enum: [negative, neutral, positive] }
        comment: { type: string }
        categories:
          type: array
          items: { type: string }
        guest_name: { type: string }
        guest_phone: { type: string, maxLength: 32, pattern: "^[+()0-9 .-]*$" }
        guest_email: { type: string, format: email, maxLength: 254 }
        wants_follow_up: { type: boolean }
        contact_consent: { type: boolean }
        marketing_consent: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        submitted_at: { type: string, format: date-time }
    RecoveryCase:
      type: object
      required: [id, tenant_id, location_id, feedback_response_id, status, priority, sentiment, rating, feedback_preview, created_reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        feedback_response_id: { type: string, format: uuid }
        status: { type: string }
        priority: { type: string }
        sentiment: { type: string }
        rating: { type: integer }
        guest_name: { type: string }
        guest_phone: { type: string }
        guest_email: { type: string }
        feedback_preview: { type: string }
        created_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
    CreateLocationRequest:
      type: object
      required: [tenant_id, name]
      properties:
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
    CreateSurveyCampaignRequest:
      type: object
      required: [tenant_id, location_id, name, restaurant_name, headline, prompt]
      properties:
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        restaurant_name: { type: string }
        headline: { type: string }
        prompt: { type: string }
        incentive_text: { type: string }
        sms_keyword: { type: string }
        sms_phone: { type: string }
        google_review_url: { type: string, format: uri }
        yelp_review_url: { type: string, format: uri }
    CreateFeedbackLinkRequest:
      type: object
      required: [tenant_id, location_id]
      properties:
        tenant_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        name: { type: string }
        channel: { type: string }
    CreateFeedbackSessionRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        channel: { type: string }
        guest_name: { type: string }
        guest_phone: { type: string }
        guest_email: { type: string }
        wants_follow_up: { type: boolean }
        contact_consent: { type: boolean }
        marketing_consent: { type: boolean }
