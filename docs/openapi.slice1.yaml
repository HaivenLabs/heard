openapi: 3.1.0
info:
  title: Heard API
  version: 0.6.0
  description: >
    Heard's tenant-scoped campaign, guest feedback, and recovery APIs. Manager
    routes require a Passage-issued Bearer product token and matching tenant membership.
    Production validation requires EdDSA with Passage JWKS, the configured issuer,
    audience `heard`, token expiry, UUID subject and organization claims, a known
    organization role, and a `heard` product-access grant. Client role or tenant
    headers never create identity authority. JSON request bodies are bounded and
    public write routes are rate limited per resolved client address. Forwarded
    client addresses are accepted only from explicitly configured trusted proxies.
servers:
  - url: http://localhost:3010
    description: Same-origin web gateway for local development
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/v1/healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
  /api/v1/marketing-leads:
    post:
      summary: Request a heard product conversation
      description: Stores a restaurant prospect's explicit request to be contacted by heard.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketingLeadRequest"
      responses:
        "201":
          description: Contact request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingLead"
        "400":
          description: Contact request is incomplete or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RequestProtectionUnavailable" }
  /api/v1/auth/local/session:
    post:
      summary: Issue a local Passage-compatible development session
      description: Available only when the non-production local Passage adapter is enabled.
      security: []
      x-local-development-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalSessionRequest"
      responses:
        "201":
          description: Local development session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/local/registration:
    post:
      summary: Register through the local Passage-compatible development adapter
      description: >
        Creates a predictable non-production Passage account context for the
        self-service onboarding workflow. This endpoint is unavailable in
        production and is not the production Passage registration contract.
      security: []
      x-local-development-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalSessionRequest"
      responses:
        "201":
          description: Local development registration resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/start:
    get:
      summary: Start secure heard account authentication
      description: Generates state and a PKCE verifier in short-lived HttpOnly SameSite=Lax cookies, then delegates to the configured identity platform. return_to accepts only a same-site relative path. Provider details are not exposed through the consumer contract.
      security: []
      parameters:
        - {name: return_to, in: query, required: false, schema: {type: string, default: /onboarding}}
        - {name: intent, in: query, required: false, schema: {type: string, enum: [register, login], default: login}}
        - {name: email, in: query, required: false, schema: {type: string, format: email}}
      responses:
        "302": {description: Continue secure account authentication}
  /api/v1/auth/register:
    post:
      summary: Create a heard account with email and password
      description: Creates the shared identity through the configured identity service. The identity service sends a verification email before Heard asks for restaurant and first-location details.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeardRegistrationRequest"
      responses:
        "201":
          description: Account created and verification email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeardRegistrationResponse"
        "400": {description: Registration details are invalid}
        "409": {description: An account already exists for this email}
        "429": {description: Registration attempts are rate limited}
        "503": {description: Identity service unavailable}
  /api/v1/auth/login:
    post:
      summary: Sign in to heard with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeardLoginRequest"
      responses:
        "200": {description: Heard browser session established}
        "400": {description: Login details are invalid}
        "401": {description: Credentials are invalid or unavailable for Heard}
        "503": {description: Identity service unavailable}
  /api/v1/auth/callback:
    get:
      summary: Complete secure heard account authentication
      description: Validates state; handles provider cancellation and failure by redirecting to a branded Heard auth page; otherwise exchanges the one-time PKCE code server-side, verifies the identity token, stores it in an HttpOnly SameSite=Lax heard session cookie, and redirects to the saved same-site path. No token is placed in a browser URL or returned to JavaScript.
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302": {description: Secure Heard browser session established, or provider cancellation/failure returned to a branded Heard auth page}
        "400": {description: State or authorization code is invalid or expired}
        "503": {description: Identity service unavailable}
  /api/v1/session:
    get:
      summary: Resolve the current Passage identity
      responses:
        "200":
          description: Authenticated identity and claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding:
    get:
      summary: Resolve the current operator's Heard onboarding state
      responses:
        "200":
          description: Current durable onboarding state and next incomplete step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/onboarding/activations:
    post:
      summary: Create or resume the first restaurant workspace and location
      description: >
        Derives actor and account context from the verified Passage identity.
        Retries and concurrent requests for the same actor return the same
        activation, tenant, and location.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnboardingActivationRequest"
      responses:
        "200":
          description: Workspace activation created or safely resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          description: Activation data or account context is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Verified identity may not activate a Heard workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/tenants:
    post:
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /api/v1/tenants/{id}:
    get:
      summary: Get tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      summary: Change the active tenant's public handle
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantHandleRequest"
      responses:
        "200":
          description: Tenant handle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /api/v1/tenant-handles/{handle}/availability:
    get:
      summary: Check whether a public restaurant handle is available
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Handle availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantHandleAvailability"
  /api/v1/locations:
    get:
      summary: List locations for the active tenant
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Location collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Location"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Create location
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /api/v1/survey-campaigns:
    get:
      summary: List survey campaigns for the active tenant
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Survey campaign collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SurveyCampaign"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Create a survey campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSurveyCampaignRequest"
      responses:
        "201":
          description: Survey campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyCampaign"
  /api/v1/survey-campaigns/{id}:
    get:
      summary: Get a survey campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Survey campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyCampaign"
    patch:
      summary: Update a survey campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSurveyCampaignRequest"
      responses:
        "200":
          description: Survey campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyCampaign"
  /api/v1/public/surveys/{token}:
    get:
      summary: Resolve a public survey campaign by opaque token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public survey and feedback link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSurvey"
  /api/v1/public/surveys/by-path/{handle}/{slug}:
    get:
      summary: Resolve a public survey campaign by vanity handle and path
      description: >
        Resolves the customer's heard-unique handle (tenant slug) and the
        customer-configurable survey path to a public survey. Multi-segment
        paths are supported.
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public survey and feedback link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSurvey"
  /api/v1/locations/{id}:
    get:
      summary: Get location
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /api/v1/feedback-links:
    get:
      summary: List feedback links for the active tenant, optionally for a campaign
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: campaign_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Feedback link collection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedbackLink"
    post:
      summary: Create feedback link
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackLinkRequest"
      responses:
        "201":
          description: Feedback link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-links/{id}:
    patch:
      summary: Update feedback link survey path and campaign
      description: >
        Re-points an existing feedback link at a campaign and updates its
        customer-configurable survey path. The destination URL and QR are
        regenerated for the vanity path.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/FeedbackLinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeedbackLinkRequest"
      responses:
        "200":
          description: Feedback link updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-links/{id}/qr:
    post:
      summary: Regenerate QR for feedback link
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/FeedbackLinkId"
      responses:
        "200":
          description: Feedback link with QR payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-links/resolve/{token}:
    get:
      summary: Resolve feedback link token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved feedback link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackLink"
  /api/v1/feedback-sessions:
    post:
      summary: Create feedback session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackSessionRequest"
      responses:
        "201":
          description: Feedback session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSession"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RequestProtectionUnavailable" }
  /api/v1/feedback-responses:
    get:
      summary: List feedback responses
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Feedback response collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedbackResponse"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
    post:
      summary: Submit feedback response
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackRequest"
      responses:
        "201":
          description: Feedback response created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/RequestProtectionUnavailable" }
  /api/v1/feedback-responses/{id}:
    get:
      summary: Get feedback response
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feedback response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
  /api/v1/recovery-cases:
    get:
      summary: List recovery cases
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recovery case collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecoveryCase"
                  page: { type: integer }
                  page_size: { type: integer }
                  has_more: { type: boolean }
  /api/v1/recovery-cases/{id}:
    get:
      summary: Get recovery case
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recovery case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCase"
    patch:
      summary: Update recovery case status
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecoveryCaseRequest"
      responses:
        "200":
          description: Recovery case updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCase"
  /api/v1/outbox-events/{id}/requeue:
    post:
      summary: Requeue a failed outbox event
      description: Owner-only recovery operation. The failed event must belong to the active tenant; pending, processing, and processed events cannot be replayed.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Failed event safely returned to the pending queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxRequeueResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The authenticated actor is not the tenant owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Passage access token
    cookieAuth:
      type: apiKey
      in: cookie
      name: heard_session
  responses:
    Unauthorized:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource or development-only endpoint is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: JSON request body exceeds the documented endpoint limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMediaType:
      description: Request body must use application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Public write rate limit exceeded; Retry-After indicates when to retry
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RequestProtectionUnavailable:
      description: Shared abuse-protection storage is unavailable; the write fails closed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    TenantHeader:
      name: X-Heard-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedbackLinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, status]
          properties:
            message: { type: string }
            status: { type: integer }
    Identity:
      type: object
      required: [user_id, email, display_name, role, tenant_ids, permissions, provider]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string }
        tenant_ids:
          type: array
          items: { type: string, format: uuid }
        permissions:
          type: array
          items: { type: string }
        provider: { type: string }
    Session:
      type: object
      required: [access_token, expires_at, identity, tenant_id]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        identity: { $ref: "#/components/schemas/Identity" }
        tenant_id: { type: string, format: uuid }
    CreateLocalSessionRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
    HeardRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, source]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        source: { type: string, enum: [homepage, guest_demo, direct] }
    HeardRegistrationResponse:
      type: object
      required: [email, verification_delivery]
      properties:
        email: { type: string, format: email }
        verification_delivery: { type: string, enum: [requested] }
    HeardLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    CreateOnboardingActivationRequest:
      type: object
      required: [restaurant_name, restaurant_handle, location_name, source]
      additionalProperties: false
      properties:
        restaurant_name: { type: string, minLength: 2, maxLength: 160 }
        restaurant_handle: { type: string, minLength: 2, maxLength: 80 }
