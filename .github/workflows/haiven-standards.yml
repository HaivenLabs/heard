name: Haiven Standards

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  haiven-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: pnpm haiven:check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heard
          POSTGRES_USER: heard
          POSTGRES_PASSWORD: heard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heard -d heard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEARD_TEST_DATABASE_URL: postgres://heard:heard@localhost:5432/heard?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - run: go -C backend test ./...
      - run: go -C backend vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heard/web validate:contract
      - run: pnpm --filter @heard/web test
      - run: pnpm --filter @heard/web lint
      - run: pnpm --filter @heard/web build
      - name: Build production web container
        run: docker build --file web/Dockerfile --tag heard-web:ci .
      - run: mkdir -p artifacts
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: web
          format: cyclonedx-json
          output-file: artifacts/heard-web.cdx.json
          upload-artifact: false
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heard-web-sbom-${{ github.sha }}
          path: artifacts/heard-web.cdx.json
          if-no-files-found: error
          retention-days: 30
      # Audit the complete graph: install-time code executes before production
      # pruning and can access CI credentials.
      - run: pnpm audit --audit-level=high
