name: Haiven Standards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  haiven-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm haiven:check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heard
          POSTGRES_USER: heard
          POSTGRES_PASSWORD: heard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heard -d heard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEARD_TEST_DATABASE_URL: postgres://heard:heard@localhost:5432/heard?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go -C backend test ./...
      - run: go -C backend vet ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run --prefix web validate:contract
      - run: npm run --prefix web test
      - run: npm run --prefix web lint
      - run: npm run --prefix web build
      - run: npm audit --prefix web --omit=dev --audit-level=high
